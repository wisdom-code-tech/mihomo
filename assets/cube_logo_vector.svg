<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- background -->
  <rect width="200" height="200" fill="#d9ddde"/>

  <!-- subtle right/bottom shadow from the original icon -->
  <path d="M100 33 L160 67 L160 139 L100 173 L40 139 L40 67 Z"
        fill="none" stroke="#9ea3a5" stroke-width="7"
        stroke-linejoin="round" transform="translate(4 4)"/>

  <!-- main black hexagonal/cube body -->
  <path d="M100 33 L160 67 L160 139 L100 173 L40 139 L40 67 Z"
        fill="#000000" stroke="#ffffff" stroke-width="6"
        stroke-linejoin="round"/>

  <!-- internal cube separators -->
  <g fill="none" stroke="#ffffff" stroke-width="2.4"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- upper three spokes -->
    <path d="M100 39 L100 92"/>
    <path d="M42 68 L100 102"/>
    <path d="M158 68 L100 102"/>

    <!-- lower three spokes -->
    <path d="M100 102 L100 168"/>
    <path d="M92 106 L48 133"/>
    <path d="M108 106 L154 133"/>
  </g>
</svg>
