name: Build FPK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-fpk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: manager/go.mod
          cache-dependency-path: manager/go.sum

      - name: Cache upstream release assets
        uses: actions/cache@v4
        with:
          path: .cache
          key: mihomo-fpk-assets-${{ hashFiles('scripts/build.sh') }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes curl file jq unzip
          curl --fail --location --retry 3 \
            https://static2.fnnas.com/fnpack/fnpack-1.2.1-linux-amd64 \
            --output /tmp/fnpack
          chmod 755 /tmp/fnpack
          echo /tmp >> "$GITHUB_PATH"

      - name: Test manager
        working-directory: manager
        run: |
          go test ./...
          go vet ./...

      - name: Build FPK
        run: ./scripts/build.sh

      - name: Write checksum
        run: sha256sum dist/mihomo.fpk > dist/mihomo.fpk.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mihomo-fpk-${{ github.sha }}
          path: |
            dist/mihomo.fpk
            dist/mihomo.fpk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/mihomo.fpk dist/mihomo.fpk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes \
            --verify-tag
